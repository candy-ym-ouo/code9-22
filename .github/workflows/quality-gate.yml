# 发布质量门禁：推送与 PR 自动执行四道门禁；版本标签额外产出发布产物。
# 门禁定义见 scripts/release.mjs（类型检查 → 迁移回放 → 接口契约 → 前端构建）。
name: release-quality-gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 质量门禁（失败即阻断，不产出物）
        run: npm run release:check

      - name: 完整发布（仅版本标签产出物）
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release

      - name: 上传发布产物与校验清单
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release/
          retention-days: 90

      - name: 上传失败门禁日志（便于追溯）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ github.run_id }}
          path: release/
          retention-days: 30
