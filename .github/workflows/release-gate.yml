# 发布质量门禁：类型检查 → 迁移回放 → 接口契约 → 前端构建
# 任一失败即阻断产物；全部通过后 release/ 清单作为 CI 构件归档，保证版本与校验清单可追溯。
name: release-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 四道门禁一键执行；失败即非零退出，流水线变红，产物步骤不会执行
      - run: npm run release:gate

      - name: 归档发布清单（版本 + 校验和，可追溯）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release/
          retention-days: 90
